name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greenasync_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: greenasync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenasync_test -d greenasync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://greenasync_test:test_only_password@127.0.0.1:5432/greenasync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
