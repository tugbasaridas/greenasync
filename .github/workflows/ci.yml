name: Build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: greenasync_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: greenasync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenasync_test -d greenasync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://greenasync_test:test_only_password@127.0.0.1:5432/greenasync_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -p 'test_measure.py' -v
  windows-demo:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the embedded database outside the checkout
        shell: pwsh
        run: |
          $env:DATABASE_URL = 'postgresql://test:test@127.0.0.1:1/unused'
          $env:HR_USERNAME = 'previous-demo-user'
          $env:HR_PASSWORD = 'previous-demo-password'
          $log = Join-Path $env:RUNNER_TEMP 'greenasync-backend.log'
          $errors = Join-Path $env:RUNNER_TEMP 'greenasync-backend-errors.log'
          $backend = Start-Process cmd.exe -ArgumentList '/d','/c','npm run dev:backend' -PassThru -RedirectStandardOutput $log -RedirectStandardError $errors
          try {
            $deadline = (Get-Date).AddSeconds(60)
            do {
              $health = $null
              try { $health = Invoke-RestMethod 'http://127.0.0.1:3000/api/health' -TimeoutSec 2 } catch { Start-Sleep -Milliseconds 500 }
            } while (-not $health -and (Get-Date) -lt $deadline)
            if ($health.status -ne 'ok' -or $health.storageMode -ne 'embedded') {
              Get-Content $log,$errors
              throw 'Local backend health check failed'
            }
            $loginBody = @{ username = 'ik'; password = '1234' } | ConvertTo-Json
            $login = Invoke-RestMethod 'http://127.0.0.1:3000/api/hr/login' -Method Post -ContentType 'application/json' -Body $loginBody -SessionVariable hrSession
            $session = Invoke-RestMethod 'http://127.0.0.1:3000/api/hr/me' -WebSession $hrSession
            if ($login.username -ne 'ik' -or $session.username -ne 'ik') {
              throw 'Local demo HR login failed'
            }
            $applications = Invoke-RestMethod 'http://127.0.0.1:3000/api/hr/applications' -WebSession $hrSession
            $demoId = '52e3a9e6-4e37-4d59-8bf4-9d45e1b96828'
            $demo = @($applications.items | Where-Object { $_.id -eq $demoId })
            if ($demo.Count -ne 1 -or $demo[0].answerCount -ne 1) {
              throw 'Expected one synthetic application with one answer'
            }
            $details = Invoke-RestMethod "http://127.0.0.1:3000/api/hr/applications/$demoId" -WebSession $hrSession
            if ($details.answers[0].questionId -ne 2 -or $details.answers[0].transcript -notlike 'Merhaba, ben Deniz.*') {
              throw 'Expected the synthetic transcript'
            }
            $audio = Invoke-WebRequest "http://127.0.0.1:3000/api/hr/applications/$demoId/answers/2/audio" -WebSession $hrSession
            if ($audio.Headers['Content-Type'] -notcontains 'audio/webm' -or $audio.RawContentLength -ne $details.answers[0].audioBytes) {
              throw 'Expected the synthetic audio download'
            }
            $db = Join-Path $env:LOCALAPPDATA 'GreenAsync\class-demo-v2\postgres'
            if (-not (Test-Path (Join-Path $db 'PG_VERSION'))) { throw 'Expected PGlite data outside the checkout' }
          } finally {
            if (-not $backend.HasExited) { taskkill /PID $backend.Id /T /F }
          }

